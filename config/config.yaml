# @package _global_
defaults:
  - _self_
  - override /hydra/hydra_logging: disabled
  - override /hydra/job_logging: disabled

hydra:
  output_subdir: null
  run:
    dir: .

# 입력 STEP 경로. 비워 두었으므로 커맨드라인에서 반드시 지정해야 한다.
#   python main.py step_path=/path/to/assembly.stp output_path=/path/to/result.msgpack
step_path: ''

# 출력 msgpack 경로. 분해 경로가 저장되며, 뒤집으면 조립 경로가 된다.
output_path: ''

# 조립 상태의 간섭보다 이만큼 더 파고드는 것까지 허용한다(모델 좌표계 길이).
#   간섭 길이 = (겹침 부피)^(1/3),  쌍별 상한 = 조립 상태 간섭 길이 + 이 값
#
# 부피가 아니라 길이인 이유: 부피는 L^3 로 스케일해 같은 값이 부품마다 다른 물리량을
# 뜻하고, 실측에서 부피는 맞물림 깊이가 아니라 접촉 면적을 따라간다(log-log 기울기
# 1.06, 상관 0.948). 막히는 지점의 값 산포가 부피 3,211배 대 길이 14.8배다.
#
# 값에 따른 실측 (분해 개수 / 궤적 재생으로 잰 실제 최대 증가):
#   1.0  Cleaner 10/13 (0.0002)   Hair Dryer 10/17 (0.8562)
#   2.0  Cleaner 13/13 (1.1057)   Hair Dryer 10/17 (1.6082)
#   3.0  Cleaner 13/13 (2.4601)   Hair Dryer 13/17 (2.9908)
#   5.0  Cleaner 13/13 (4.4118)   Hair Dryer 14/17 (4.9645, 작은 부품이 부피의 82.8%)
#
# 키우면 더 많이 분해되지만 부품이 실제로 서로를 파고든다. 실행 로그의 '조립 간섭 길이'
# 분포와 함께 보고 결과를 시각화로 확인하시오.
max_interference_growth: 2.0

search:
  # 부품 하나당 RRT* 최대 반복 수. 첫 실행 가능 경로에서 멈추므로 직선으로 빠지는 부품은
  # 반복 0 회다.
  iteration_count: 400

  # 참이면 24 가지 이산 자세(각 축 0·90·180·270°)를 함께 탐색한다.
  does_sample_rotation: true

  # 난수 시드. 같은 시드는 같은 결과를 준다.
  random_seed: 0

  # 부품 하나당 탐색 시간 상한(초). 넘기면 '분해 불가능' 으로 기록되지만 기하학적 증명이
  # 아니라 이 상한에 걸린 것이다.
  time_budget_seconds: 600

  # 기준선 보정 병렬 워커 수. 판정 라이브러리가 자체 스레드를 쓰므로 코어 수보다 크게
  # 잡을 이유는 없다.
  worker_count: 60
